global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ledgerlens-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: ledgerlens-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9091']
